server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    location = /favicon.ico {
        try_files $uri =404;
    }

    # SPA routing: alle Nicht-Datei-Anfragen an index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
